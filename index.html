<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>Apex Dynasty — Motorsport Manager</title>
  <meta name="description" content="Gestionale motorsport multi-categoria: Formula, Rally ed Endurance." />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <style>
    html,body{background:#07090d;margin:0}
    /* boot splash: visible only until the game renders its first screen into #app */
    .boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;color:#f4f5f7;font:italic 800 34px/1 'Barlow Condensed','Arial Narrow',sans-serif;letter-spacing:.04em;text-transform:uppercase;overflow:hidden}
    .boot::before{content:'';position:absolute;right:-10%;top:-20%;width:46%;height:140%;transform:skewX(-12deg);background:linear-gradient(180deg,#101318,#07090d 70%)}
    .boot b{position:relative;color:#e5141b}
    .boot span{position:relative}
    .boot i{position:relative;display:block;width:120px;height:4px;transform:skewX(-12deg);background:rgba(255,255,255,.1);overflow:hidden}
    .boot i::after{content:'';position:absolute;inset:0;width:40%;background:#e5141b;animation:bootbar 1s cubic-bezier(.65,0,.35,1) infinite}
    @keyframes bootbar{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
    @media (prefers-reduced-motion:reduce){.boot i::after{animation:none;width:100%}}
  </style>
</head>
<body>
  <div id="app"><div class="boot" role="status" aria-label="Caricamento"><span>Apex <b>Dynasty</b></span><i></i></div></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
