name: Build desktop (macOS · Windows · Linux)

on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
          - os: windows-latest
            script: dist:win
          - os: ubuntu-latest
            script: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: apex-dynasty-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - run: ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          make_latest: 'true'
          name: Baso Hub v${{ steps.ver.outputs.v }}
          files: out/*
          body: |
            ## Baso Hub — Apex Dynasty · Scontro Totale · Voragine

            Tre giochi in un'unica app: il gestionale motorsport **Apex Dynasty** (Formula, Formula Apex 2, Rally, Endurance, con highlights delle gare), le corse a contatto di **Scontro Totale** e l'arcade **Voragine**. Le novità sono nel README del progetto.

            ### Download
            | Sistema | File |
            |---|---|
            | macOS Apple Silicon (M1/M2/M3/M4) | `ApexDynasty-*-mac-arm64.dmg` |
            | macOS Intel | `ApexDynasty-*-mac-x64.dmg` |
            | Windows 10/11 (installer) | `ApexDynasty-*-Setup.exe` |
            | Windows (portable, nessuna installazione) | `ApexDynasty-*-Portable.exe` |
            | Linux | `*.AppImage` |

            **macOS:** l'app non è firmata con un certificato Apple. Al primo avvio fai *clic destro → Apri*. Se macOS dice che l'app è "danneggiata", apri il Terminale ed esegui:
            `xattr -cr "/Applications/Apex Dynasty.app"`

            **Windows:** se SmartScreen mostra un avviso, clicca *Ulteriori informazioni → Esegui comunque*.
